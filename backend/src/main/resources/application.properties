spring.application.name=prepai-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9090/prepai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prepai_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:local-dev-only-secret-never-use-in-production-12345}

gemini.api.key=${GEMINI_API_KEY:}